name: Publish tagged installer
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Attach versioned installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" "dist/dsh-reply-reader-$version.tgz" --verify-tag --title "$RELEASE_TAG · 翻译与朗读" --notes '在 DSH 插件管理中选择下方 .tgz 安装包。此版本更新了翻译与朗读设置页。'
