name: Publish tagged installer
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/release.yml', 'dist/*.tgz']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Attach versioned installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" "dist/dsh-reply-reader-$version.tgz" --verify-tag --title "$tag · 翻译与朗读" --notes '在 DSH 插件管理中选择下方 .tgz 安装包。此版本更新了翻译与朗读设置页。'
